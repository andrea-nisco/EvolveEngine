[package]
name = "evolve_player"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone player for EvolveEngine projects (desktop and web)."

[lib]
name = "evolve_player_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "evolve_player"
path = "src/main.rs"

[features]
# `--ui-demo` on the command line: draws the UI demo of EVOLVE_UI_PLAN.md over the game (it brings the default fonts, 3 MB, into the program).
ui-demo = []

[dependencies]
evolve_engine = { path = "../evolve_engine" }
evolve_ui_scene = { path = "../evolve_ui_scene" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# OpenGL keeps the player small and lets the same code run in the browser (WebGL).
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No bundled fonts in the browser build: a game only draws vectors, and fonts are over a megabyte.
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "Element"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }


[dev-dependencies]
evolve_ui_core = { path = "../evolve_ui_core" }
evolve_ui_text = { path = "../evolve_ui_text" }
