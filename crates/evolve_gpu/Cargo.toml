[package]
name = "evolve_gpu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GPU renderer for EvolveEngine scenes (wgpu). See GPU_RENDERER_PLAN.md."

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
evolve_engine = { version = "0.1.0", path = "../evolve_engine" }
egui = { version = "0.36.2", optional = true, default-features = false }
egui-wgpu = { version = "0.36.2", optional = true, default-features = false }
lyon = "1.0.19"
pollster = "0.4.0"
wgpu = "30.0.1"
# std::time::Instant panics in browsers; this one is the same type natively and works on the web.
web-time = "1.1"

[target.wasm32-unknown-unknown.dependencies]
# Needed by a dependency of the scripting engine in browsers (see .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# The thin layer that shows pictures inside egui (the editor and the desktop player). The renderer itself does not need it.
egui = ["dep:egui", "dep:egui-wgpu"]
